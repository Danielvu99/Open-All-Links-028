      border-radius: 4px;

    .link-url {

      margin-bottom: 5px;
      font-size: 14px;
      font-weight: bold;
      color: #333;
      word-wrap: break-word;
    }

    .link-iframe {

      height: 180px;
      border: none;
      border-radius: 4px;
    }

    #linkDisplay {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
    }

    @media (max-width: 768px) {
      .link-container {
        width: 48%;
      }
    }

    @media (max-width: 480px) {
      .link-container {
        width: 100%;

    }

    const pageSize = 20;
    const groupState = {}; // { "Nhóm 1": currentIndex, ... }
    const linkDisplay = document.getElementById("linkDisplay");

    // Khởi tạo nút nhóm
    const groupButtonsContainer = document.getElementById("groupButtons");
    for (const groupName in linkGroups) {
      groupState[groupName] = 0; // bắt đầu từ 0
      const btn = document.createElement('button');
      btn.textContent = groupName;
      btn.onclick = () => handleGroupClick(groupName);
      groupButtonsContainer.appendChild(btn);
    }

    function handleGroupClick(groupName) {
      const links = linkGroups[groupName];
      const start = groupState[groupName];
      const end = start + pageSize;

      // Nếu hết link thì dừng lại
      if (start >= links.length) {
        alert("Đã hết link của " + groupName);
        return;
      }

      // Xoá iframe cũ
      linkDisplay.innerHTML = '';

      const batch = links.slice(start, end);
      batch.forEach(link => {
        const container = document.createElement('div');
        container.className = 'link-container';

        const a = document.createElement('a');
        a.href = link;
        a.target = "_blank";
        a.className = "link-url";
        a.textContent = link;

        const iframe = document.createElement('iframe');
        iframe.src = link;
        iframe.className = 'link-iframe';
        iframe.sandbox = "allow-scripts allow-same-origin";

        container.appendChild(a);
        container.appendChild(iframe);
        linkDisplay.appendChild(container);
      });

      // Tăng chỉ số cho lần bấm tiếp theo
      groupState[groupName] += pageSize;
    }
